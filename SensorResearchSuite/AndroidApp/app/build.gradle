plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.research.sensormax'
    compileSdk 34

    defaultConfig {
        applicationId "com.research.sensormax"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "3.0-Multi-Device"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_21
        targetCompatibility JavaVersion.VERSION_21
    }

    kotlinOptions {
        jvmTarget = '21'
    }

    buildFeatures {
        // AGP 8+ stopped generating BuildConfig by default; MainActivity's
        // boot log reads BuildConfig.VERSION_NAME/VERSION_CODE.
        buildConfig true
    }

    // Prevent a stale local merge artifact from defining duplicate runtime types.
    // The authoritative implementation is ExperimentBufferModel.kt.
    sourceSets {
        main {
            java {
                exclude '**/PhyphoxBufferModel.kt'
            }
        }
    }

}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation("com.github.PhilJay:MPAndroidChart:v3.1.0")
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test:runner:1.6.2'
}