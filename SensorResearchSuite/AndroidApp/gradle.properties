# Cap daemon memory at 1GB to leave the remaining 1GB for Android Studio's 2048M limit
org.gradle.jvmargs=-Xmx1024m -XX:+UseG1GC -XX:MaxMetaspaceSize=384m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Restrict parallel execution strictly to your 2 available CPU cores to prevent thread thrashing
org.gradle.workers.max=2
org.gradle.parallel=true

# Enable file watching for faster incremental builds on Windows NTFS file systems
org.gradle.vfs.watch=true

android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official